services:
  livekit-agent:
    build:
      context: ./backend
      dockerfile: livekit_agent/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "8082:8082"
    env_file:
      - ./backend/livekit_agent/.env
    environment:
      - HTTP_PORT=8082
      # LIVEKIT_URL, INTERNAL_TOKEN, and SHADOWLEARN_BACKEND_URL set in env_file.
      # SHADOWLEARN_BACKEND_URL is the China-side backend's public URL; the agent
      # fetches each speak session's Google key there with INTERNAL_TOKEN.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
