services:
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4416/ping').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=shadowlearn
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-shadowlearn}
      - POSTGRES_DB=shadowlearn
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shadowlearn"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-shadowlearn}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-shadowlearn}
    ports:
      - "127.0.0.1:9002:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend/youtube_cookies.txt:/app/youtube_cookies.txt
    env_file:
      - ./backend/.env
    environment:
      - SHADOWLEARN_YTDLP_COOKIES_FILE=/app/youtube_cookies.txt
      - SHADOWLEARN_YTDLP_BGUTIL_URL=http://bgutil-provider:4416
      - SHADOWLEARN_DATABASE_URL=postgresql+asyncpg://shadowlearn:${POSTGRES_PASSWORD:-shadowlearn}@postgres:5432/shadowlearn
      - SHADOWLEARN_S3_ENDPOINT=http://minio:9000
      - SHADOWLEARN_S3_ACCESS_KEY=${MINIO_ROOT_USER:-shadowlearn}
      - SHADOWLEARN_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-shadowlearn}
      # SHADOWLEARN_OFFSHORE_BASE_URL and SHADOWLEARN_OFFSHORE_INTERNAL_TOKEN
      # must be set in backend/.env pointing at the offshore server.
      # RAG retrieval → externally-running agentic-rag service (separate repo, not
      # in this compose). Override with its reachable URL per environment.
      - SHADOWLEARN_AGENTIC_RAG_BASE_URL=${AGENTIC_RAG_BASE_URL:-http://host.docker.internal:8010}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      bgutil-provider:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
