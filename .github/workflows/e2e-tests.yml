name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shadowlearn
          POSTGRES_PASSWORD: shadowlearn
          POSTGRES_DB: shadowlearn
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U shadowlearn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MINIO_ROOT_USER: shadowlearn
      MINIO_ROOT_PASSWORD: shadowlearn
      E2E_API_URL: http://127.0.0.1:8000
      SHADOWLEARN_ENABLE_TEST_ROUTES: 'true'
      SHADOWLEARN_FRONTEND_ORIGIN_ALLOWLIST: '["http://localhost:5173"]'
      SHADOWLEARN_SMTP_HOST: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Start MinIO
        run: |
          docker run -d -p 9005:9000 -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            ghcr.io/xzneozx96/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:9005/minio/health/live && exit 0
            sleep 1
          done
          exit 1

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Generate throwaway backend secrets
        working-directory: backend
        run: |
          uv sync
          {
            echo "SHADOWLEARN_JWT_SECRET=$(openssl rand -hex 32)"
            echo "SHADOWLEARN_JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "SHADOWLEARN_ENCRYPTION_KEY=$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          } >> "$GITHUB_ENV"

      - name: Start backend
        working-directory: backend
        run: |
          uv run alembic upgrade head
          nohup uv run uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 60); do
            curl -sf http://127.0.0.1:8000/api/health/deps && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Install Playwright browsers (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            ${{ runner.temp }}/backend.log
          retention-days: 14

